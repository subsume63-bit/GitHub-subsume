<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공지사항 · MARIA Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <style>
    :root {
      --nav: #1f332f; --nav-text: #e9f1ee;
      --bg: #ffffff; --text: #1d2b27; --muted: #5a6b66;
      --line: #e6ebe9; --accent: #17694f; --accent-soft: #e4f2ec; --danger: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --nav: #14221f; --bg: #101a18; --text: #e6efec; --muted: #9db0aa;
        --line: #26352f; --accent: #6fd0a8; --accent-soft: #1d3a31; --danger: #f2a39e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      line-height: 1.65; -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px;
    }

    .topbar { background: var(--nav); color: var(--nav-text); }
    .topbar-inner { max-width: 960px; margin: 0 auto; padding: 0 24px; min-height: 64px; display: flex; align-items: center; }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand .logo { font-family: Georgia, "Times New Roman", serif; font-size: 1.55rem; letter-spacing: .02em; }
    .brand .hub { font-weight: 700; font-size: 1.05rem; }

    main { max-width: 960px; margin: 0 auto; padding: 48px 24px 64px; }
    .org { margin: 0; color: var(--muted); font-size: .95rem; }
    h1 { margin: 6px 0 28px; font-size: clamp(1.9rem, 4vw, 2.6rem); line-height: 1.25; letter-spacing: -.02em; }

    .list { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--text); }
    .list li { display: grid; grid-template-columns: 90px 1fr; gap: 16px; padding: 20px 4px; border-bottom: 1px solid var(--line); }
    .list li.empty { display: block; color: var(--muted); }
    .date { color: var(--muted); }
    .item-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }
    .pin { padding: 0 8px; border-radius: 999px; background: var(--accent); color: var(--bg); font-size: .75rem; font-weight: 700; }
    .title { font: inherit; font-weight: 700; font-size: 1.05rem; background: none; border: 0; padding: 0; color: var(--text); cursor: pointer; text-align: left; }
    .title:hover { text-decoration: underline; }
    .body { white-space: pre-wrap; word-break: break-word; margin-top: 10px; padding: 14px 16px; border-radius: 10px; background: var(--accent-soft); }
    .body[hidden] { display: none; }
    .item-actions { display: flex; gap: 8px; margin-top: 10px; }
    .mini { font: inherit; font-size: .82rem; padding: 3px 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
    .mini.danger { color: var(--danger); border-color: var(--danger); }

    .more { margin-top: 20px; text-align: center; }
    .more:empty { display: none; }

    .admin { margin-top: 40px; padding: 16px 18px; border: 1px dashed var(--line); border-radius: 14px; }
    .admin:empty { display: none; }
    .admin-label { margin: 0 0 10px; font-size: .9rem; font-weight: 600; color: var(--muted); }
    .adminbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .adminbar .who { margin-right: auto; font-size: .92rem; color: var(--muted); }
    .login-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .login-row input, .editor-form input[type="text"], .editor-form textarea {
      font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px;
      background: var(--bg); color: var(--text);
    }
    .editor-form { display: grid; gap: 10px; margin: 0 0 24px; padding: 16px; border: 1px solid var(--accent); border-radius: 14px; }
    .editor-form input[type="text"], .editor-form textarea { width: 100%; }
    .editor-form textarea { resize: vertical; }
    .check { display: flex; align-items: center; gap: 6px; font-size: .92rem; }
    .btn { font: inherit; font-weight: 600; font-size: .92rem; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: var(--bg); cursor: pointer; }
    .btn.ghost { background: transparent; color: var(--accent); }
    .err { margin: 8px 0 0; font-size: .9rem; color: var(--danger); }

    @media (max-width: 640px) {
      .topbar-inner { padding: 0 16px; }
      main { padding: 32px 16px 48px; }
      .list li { grid-template-columns: 1fr; gap: 4px; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./" aria-label="MARIA Hub 홈">
        <span class="logo">MARIA</span>
        <span class="hub">Hub</span>
      </a>
    </div>
  </header>

  <main>
    <p class="org">마리아의료재단</p>
    <h1>공지사항</h1>

    <div id="editor"></div>
    <ul class="list" id="notice-list"><li class="empty">불러오는 중…</li></ul>
    <div class="more" id="more"></div>
    <div class="admin" id="admin-area"></div>
  </main>

  <script>
    /* ====== 여기 두 줄만 내 Supabase 값으로 바꾸세요 ======
       Supabase → Project Settings → API 에서 복사합니다.
       KEY는 anon(public) 또는 publishable 키만 사용하세요.
       service_role / secret 키는 절대 넣으면 안 됩니다. */
const SUPABASE_URL = "https://diwondrsssxhpxybcibv.supabase.co";
const SUPABASE_KEY = "sb_publishable_iTYaFkeLOPlF0sJNUxOdHw_mXtpdSH9";      
    /* ================================================== */

    const PAGE_SIZE = 10; // 한 번에 보여줄 공지 개수 ("더 보기"를 누르면 이만큼 늘어납니다)

    const ready = SUPABASE_URL.startsWith("https://") && SUPABASE_KEY.length > 20;
    let sb = null;
    let session = null;
    let shown = PAGE_SIZE;
    if (ready) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const listEl = document.getElementById("notice-list");
    const moreEl = document.getElementById("more");
    const adminEl = document.getElementById("admin-area");
    const editorEl = document.getElementById("editor");

    function h(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function fmt(d) {
      return new Date(d).toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric" });
    }
    function emptyRow(text) {
      moreEl.replaceChildren();
      listEl.replaceChildren(h("li", "empty", text));
    }

    /* ---------- 공지 목록 (내용까지 펼쳐서 표시) ---------- */
    function renderList(data, hasMore) {
      listEl.replaceChildren();
      if (!data.length) return emptyRow("등록된 공지가 없습니다.");
      data.forEach((n) => {
        const li = h("li");
        li.append(h("span", "date", fmt(n.created_at)));

        const box = h("div", "item");
        const head = h("div", "item-head");
        if (n.pinned) head.append(h("span", "pin", "중요"));
        const t = h("button", "title", n.title);
        t.type = "button";
        t.setAttribute("aria-expanded", "true");
        head.append(t);
        box.append(head);

        const body = h("div", "body", n.body || "(내용 없음)");
        box.append(body);
        t.onclick = () => {
          body.hidden = !body.hidden;
          t.setAttribute("aria-expanded", String(!body.hidden));
        };

        if (session) {
          const act = h("div", "item-actions");
          const ed = h("button", "mini", "수정");
          ed.type = "button";
          ed.onclick = () => openEditor(n);
          const del = h("button", "mini danger", "삭제");
          del.type = "button";
          del.onclick = async () => {
            if (!confirm("이 공지를 삭제할까요? 되돌릴 수 없어요.")) return;
            const { error } = await sb.from("notices").delete().eq("id", n.id);
            if (error) return alert("삭제하지 못했어요: " + error.message);
            loadNotices();
          };
          act.append(ed, del);
          box.append(act);
        }
        li.append(box);
        listEl.append(li);
      });

      moreEl.replaceChildren();
      if (hasMore) {
        const b = h("button", "btn ghost", "더 보기");
        b.type = "button";
        b.onclick = () => { shown += PAGE_SIZE; loadNotices(); };
        moreEl.append(b);
      }
    }

    async function loadNotices() {
      if (!ready) return emptyRow("Supabase 연결 정보가 아직 입력되지 않았습니다. 파일 아래쪽의 SUPABASE_URL과 SUPABASE_KEY를 채워 주세요.");
      const { data, error } = await sb.from("notices")
        .select("*")
        .order("pinned", { ascending: false })
        .order("created_at", { ascending: false })
        .range(0, shown); // shown + 1개를 받아서 더 있는지 확인
      if (error) return emptyRow("공지를 불러오지 못했습니다. (" + error.message + ")");
      renderList(data.slice(0, shown), data.length > shown);
    }

    /* ---------- 글쓰기 / 수정 ---------- */
    function closeEditor() { editorEl.replaceChildren(); }

    function openEditor(post) {
      const p = post || { title: "", body: "", pinned: false };
      const f = h("form", "editor-form");
      f.append(h("p", "admin-label", post ? "공지 수정" : "새 공지 쓰기"));

      const t = h("input");
      t.type = "text"; t.placeholder = "제목"; t.value = p.title; t.required = true; t.maxLength = 120;
      const b = h("textarea");
      b.rows = 7; b.placeholder = "내용 (줄바꿈이 그대로 보입니다)"; b.value = p.body;

      const lab = h("label", "check");
      const c = h("input");
      c.type = "checkbox"; c.checked = p.pinned;
      lab.append(c, document.createTextNode("중요 공지로 맨 위에 고정"));

      const act = h("div", "adminbar");
      const save = h("button", "btn", "저장");
      save.type = "submit";
      const cancel = h("button", "btn ghost", "취소");
      cancel.type = "button";
      cancel.onclick = closeEditor;
      act.append(save, cancel);

      const err = h("p", "err");
      f.append(t, b, lab, act, err);

      f.onsubmit = async (ev) => {
        ev.preventDefault();
        save.disabled = true;
        const payload = { title: t.value.trim(), body: b.value, pinned: c.checked };
        const res = post
          ? await sb.from("notices").update(payload).eq("id", post.id)
          : await sb.from("notices").insert(payload);
        save.disabled = false;
        if (res.error) { err.textContent = "저장하지 못했어요: " + res.error.message; return; }
        closeEditor();
        loadNotices();
      };
      editorEl.replaceChildren(f);
      t.focus();
      f.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    /* ---------- 관리자 로그인 창 ---------- */
    function renderAdmin() {
      adminEl.replaceChildren();
      if (!ready) return;

      if (session) {
        const w = h("div", "adminbar");
        w.append(h("span", "who", "관리자: " + session.user.email));
        const nw = h("button", "btn", "새 글 쓰기");
        nw.type = "button";
        nw.onclick = () => openEditor(null);
        const out = h("button", "btn ghost", "로그아웃");
        out.type = "button";
        out.onclick = async () => { await sb.auth.signOut(); };
        w.append(nw, out);
        adminEl.append(w);
        return;
      }

      adminEl.append(h("p", "admin-label", "관리자 로그인"));
      const f = h("form", "login-row");
      const em = h("input");
      em.type = "email"; em.placeholder = "이메일"; em.required = true; em.autocomplete = "username";
      const pw = h("input");
      pw.type = "password"; pw.placeholder = "비밀번호"; pw.required = true; pw.autocomplete = "current-password";
      const go = h("button", "btn", "로그인");
      go.type = "submit";
      f.append(em, pw, go);
      const err = h("p", "err");
      f.onsubmit = async (ev) => {
        ev.preventDefault();
        go.disabled = true;
        err.textContent = "";
        const { error } = await sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
        go.disabled = false;
        if (error) err.textContent = "로그인하지 못했어요. 이메일과 비밀번호를 확인하세요.";
      };
      adminEl.append(f, err);
    }

    async function init() {
      if (ready) {
        const { data } = await sb.auth.getSession();
        session = data.session;
        sb.auth.onAuthStateChange((event, s) => {
          if (event === "INITIAL_SESSION") return;
          session = s;
          closeEditor();
          renderAdmin();
          loadNotices();
        });
      }
      renderAdmin();
      loadNotices();
    }
    init();
  </script>
</body>
</html>
