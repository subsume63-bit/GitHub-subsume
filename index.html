<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 첫 웹페이지</title>
  <style>
    :root {
      --bg: #f3f7f4;
      --text: #1d2b24;
      --muted: #5b6b63;
      --accent: #2f7d5b;
      --card: #ffffff;
      --line: #d5e2da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14201a;
        --text: #e8f1ec;
        --muted: #9db0a5;
        --accent: #5fc795;
        --card: #1c2c24;
        --line: #2d4338;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
      line-height: 1.7;
    }
    main {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px;
    }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    p { margin: 0 0 20px; color: var(--muted); }
    .counter {
      font-size: 3rem;
      font-weight: 700;
      color: var(--accent);
      margin: 8px 0 16px;
    }
    button {
      font: inherit;
      font-weight: 600;
      padding: 10px 20px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      margin-left: 8px;
    }
    .memo { margin-top: 28px; }
    input {
      width: 100%;
      font: inherit;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
    }
    #greeting { margin-top: 12px; min-height: 1.7em; color: var(--text); }
  </style>
</head>
<body>
  <main>
    <h1>안녕하세요, GitHub!</h1>
    <p>이 페이지는 subsume 업로드 연습용이에요. 버튼이 잘 작동하면 코드가 정상입니다.</p>

    <div class="counter" id="count">0</div>
    <button id="plus">클릭 +1</button>
    <button id="reset" class="ghost">초기화</button>

    <div class="memo">
      <label for="name">이름을 입력해 보세요</label>
      <input id="name" type="text" placeholder="예: 민수">
      <div id="greeting"></div>
    </div>
  </main>

  <script>
    let count = 0;
    const countEl = document.getElementById("count");

    document.getElementById("plus").addEventListener("click", () => {
      count += 1;
      countEl.textContent = count;
    });

    document.getElementById("reset").addEventListener("click", () => {
      count = 0;
      countEl.textContent = count;
    });

    document.getElementById("name").addEventListener("input", (e) => {
      const name = e.target.value.trim();
      document.getElementById("greeting").textContent =
        name ? name + "님, 반가워요!" : "";
    });
  </script>
</body>
</html>
